<!DOCTYPE html>
<html>

<head>
    <title>Upload Notes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Virtual Classroom</h1>
</header>

<div class="container">

    <div class="card">

        <h2>Upload Notes</h2>

        <form onsubmit="uploadNotes(event)">

            <label>Subject</label>

            <input
                type="text"
                id="subject"
                placeholder="Enter subject"
                required
            >

            <label>Select File</label>

            <input
                type="file"
                id="notesFile"
                required
            >

            <button type="submit">
                Upload Notes
            </button>

        </form>

        <p id="uploadMessage"></p>

    </div>

</div>

<script>

function uploadNotes(event) {

    event.preventDefault();

    const file =
        document.getElementById("notesFile").files[0];

    document.getElementById("uploadMessage").innerText =
        "Notes uploaded successfully: " + file.name;

}

</script>

</body>
</html>
