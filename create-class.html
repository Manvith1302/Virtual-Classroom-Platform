<!DOCTYPE html>
<html>

<head>
    <title>Create Virtual Class</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Virtual Classroom</h1>
</header>

<div class="container">

    <div class="card">

        <h2>Create Virtual Class</h2>

        <form onsubmit="createClass(event)">

            <label>Class Name</label>

            <input
                type="text"
                id="className"
                placeholder="Example: Java Programming"
                required
            >

            <label>Teacher Name</label>

            <input
                type="text"
                id="teacher"
                placeholder="Enter teacher name"
                required
            >

            <label>Date</label>

            <input type="date" required>

            <label>Time</label>

            <input type="time" required>

            <button type="submit">
                Create Class
            </button>

        </form>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
